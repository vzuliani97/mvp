name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read the repo unless they declare more.
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run integration tests against PostgreSQL
        run: docker compose --profile test run --rm --build backend-test

      - name: Build production images
        run: docker compose build backend frontend

      - name: Tear down
        if: always()
        run: docker compose --profile test down -v

  security:
    name: Security (secrets, dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - name: Scan git history for secrets (Gitleaks)
        run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact
      - name: Audit production dependencies (backend)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Audit production dependencies (frontend)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
