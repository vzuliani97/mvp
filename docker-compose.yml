services:

  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reservations}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-reservations}"
        ]
      interval: 5s
      timeout: 3s
      retries: 10


  backend:
    build:
      context: ./backend
      target: production

    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://app:app_password@postgres:5432/reservations
      CORS_ORIGIN: http://localhost:8080
      LOG_LEVEL: info

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 10


  frontend:
    build:
      context: ./frontend

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy


  backend-test:
    build:
      context: ./backend
      target: test

    profiles:
      - test

    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://app:app_password@postgres:5432/reservations
      CORS_ORIGIN: http://localhost:8080
      LOG_LEVEL: silent

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data: